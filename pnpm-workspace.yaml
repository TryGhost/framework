packages:
  - 'packages/*'
overrides:
  axios: ^1.15.0
  fast-xml-parser: ^5.7.0
  js-yaml@<3.15.0: 5.4.3
  yauzl: 3.4.0
strictDepBuilds: true
blockExoticSubdeps: true
allowBuilds:
  # Permitted builds are version-scoped. Adding or updating a permitted version
  # requires an explicit Platform security review.
  'dtrace-provider@0.8.8': true
  'esbuild@0.28.2': true
  'nx@23.2.0': true
  # Nx uses its prebuilt platform package; leave the new postinstall disabled.
  'nx@23.2.1': false
  'better-sqlite3@13.0.3': true
  sqlite3: false
minimumReleaseAge: 4320
catalog:
  sinon: 22.1.0
  typescript: 7.0.2
minimumReleaseAgeExclude:
  # Renovate security update: nx@23.2.1
  - nx@23.2.1
  - '@nx/js@23.2.1'
