packages:
  - 'packages/*'
overrides:
  axios: ^1.15.0
  fast-xml-parser: ^5.7.0
  js-yaml@<3.15.0: 5.5.0
strictDepBuilds: true
blockExoticSubdeps: true
allowBuilds:
  dtrace-provider: false
  'esbuild@0.28.2': true
  # Nx uses its prebuilt platform package; leave the new postinstall disabled.
  'nx@24.0.5': false
  'better-sqlite3@13.0.3': true
  sqlite3: false
  # The watcher ships platform binaries; do not run its unreviewed install script.
  '@parcel/watcher@2.6.0': false
minimumReleaseAge: 4320
catalog:
  sinon: 22.1.0
  typescript: 7.0.2
minimumReleaseAgeExclude:
  # Renovate security update: nx@23.2.1
  - nx@23.2.1
  - '@nx/js@23.2.1'
  # Renovate security update: multer@2.5.0
  - multer@2.5.0
